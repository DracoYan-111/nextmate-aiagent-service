apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiagent-spc-sa
  namespace: dev
  annotations:
    cce.io/dew-resource: "[\"aiagent-dev\"]"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: aiagent-spc
  namespace: dev
spec:
  provider: cce     # 固定为cce
  parameters:
    objects: |
          - objectName: "aiagent-dev"
            objectAlias: "confidential.json"
            objectVersion: "latest"
            objectType: "csms"